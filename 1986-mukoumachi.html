    function renderApp(data) {
      const app = document.getElementById('app');
      app.innerHTML = ''; 

      // ヘッダー生成
      const header = `
        <header class="flex flex-col md:flex-row md:justify-between md:items-end border-b-2 border-zinc-800 pb-2 mb-8">
          <div>
            <div class="text-base font-bold text-zinc-500 tracking-wider mb-1">${data.meta.date}</div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-widest">${data.meta.depotName} <span class="text-xl md:text-2xl ml-4 font-normal tracking-normal">${data.meta.depotCode}</span></h1>
          </div>
          <div class="text-2xl md:text-3xl font-bold font-serif mt-2 md:mt-0">${data.meta.totalCars}<span class="text-base md:text-lg font-normal font-sans ml-1">両</span></div>
        </header>
      `;
      app.insertAdjacentHTML('beforeend', header);

      const contentWrapper = document.createElement('div');
      contentWrapper.className = 'flex flex-col lg:flex-row gap-10';
      
      const main = document.createElement('main');
      main.className = 'flex-1 space-y-12';
      
      data.sections.forEach(section => {
        const sectionHtml = `
          <section>
            <div class="flex justify-between items-end mb-1">
              <h2 class="text-xl font-bold flex items-end gap-3">
                <span class="bg-zinc-800 text-white px-2 py-0.5 text-sm rounded-sm">${section.title}</span>
                <span class="text-lg tracking-widest">${section.subtitle}</span>
              </h2>
              <div class="text-xs text-zinc-500 italic">←${section.direction.left} <span class="inline-block w-20 border-t border-zinc-300 mx-2 mb-1"></span> ${section.direction.right}→</div>
            </div>
            <div class="overflow-x-auto pb-2">
              <table class="timetable w-full text-sm">
                <thead>
                  <tr class="panto-row no-border">
                    <th class="no-border w-10"></th>
                    ${section.columns.map((_, i) => `<th class="no-border panto-cell">${section.pantographs.includes(i+1) ? '◇' : ''}</th>`).join('')}
                  </tr>
                  <tr class="text-xs text-zinc-400">
                    <th class="no-border"></th>
                    ${section.columns.map(col => `<th>${col}</th>`).join('')}
                  </tr>
                  <tr class="text-xs">
                    <th class="no-border"></th>
                    ${section.carTypes.map(type => `<th>${type}</th>`).join('')}
                  </tr>
                  <tr class="header-row">
                    <th class="no-border"></th>
                    ${section.carSeries.map(ser => `<th class="font-bold">${ser}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${section.formations.map(f => `
                    <tr>
                      <th class="no-border pr-3 font-bold text-zinc-500">${f.label}</th>
                      ${f.numbers.map(num => `<td>${num}</td>`).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            ${section.note ? `<div class="text-right text-xs mt-1 text-zinc-500 font-mono">${section.note}</div>` : ''}
          </section>
        `;
        main.insertAdjacentHTML('beforeend', sectionHtml);
      });

      const aside = document.createElement('aside');

              <span>${group.title}</span>
              <span>${group.total}両</span>
            </div>
            <table class="w-full text-xs text-zinc-600">
              ${group.items.map(item => `
                <tr>
                  <td class="py-0.5">${item.code}</td>
                  <td>${item.name}</td>
                  <td class="text-right font-mono">${item.count}</td>
                </tr>
              `).join('')}
            </table>
          </div>
        `;
      });

              ${sv.items.map(i => `<li>・ ${i}</li>`).join('')}
            </ul>
          </div>
        `;
      });

      aside.innerHTML = sidebarHtml;
      
      contentWrapper.appendChild(main);
      contentWrapper.appendChild(aside);
      app.appendChild(contentWrapper);
    }
